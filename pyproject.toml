[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rc-agent-ops"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
    "rc-entitlement-gate @ git+https://github.com/zarpa-cat/rc-entitlement-gate.git",
    "agent-billing-meter @ git+https://github.com/zarpa-cat/agent-billing-meter.git",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110",
    "starlette>=0.36",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "typer[all]>=0.12",
    "fastapi>=0.110",
    "starlette>=0.36",
    "httpx>=0.27",
]

[project.scripts]
rcops = "rc_agent_ops.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.15.6",
    "starlette>=0.52.1",
    "typer>=0.24.1",
]
