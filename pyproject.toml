[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rc-agent-ops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rc-entitlement-gate @ git+https://github.com/zarpa-cat/rc-entitlement-gate.git",
    "agent-billing-meter @ git+https://github.com/zarpa-cat/agent-billing-meter.git",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "typer[all]>=0.12",
]

[project.scripts]
rcops = "rc_agent_ops.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
